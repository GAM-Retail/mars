name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard resolvconf

      - name: Connect to Corporate VPN
        run: |
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sleep 5
          nc -zv -w 5 ${{ secrets.HOST }} ${{ secrets.SSH_PORT }}

      - name: Setup SSH for Docker
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
      
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.HOST }}
            HostName ${{ secrets.HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config
          
      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.HOST }} >> ~/.ssh/known_hosts
      
      - name: Verify SSH Login
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "echo Connected"

      - name: Build and Deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT }}
          COMPOSE_PARALLEL_LIMIT: 1

          DATABASE_URL: ${{ vars.DATABASE_URL }}
          SHADOW_DATABASE_URL: ${{ vars.SHADOW_DATABASE_URL }}
          SESSION_SECRET: ${{ vars.SESSION_SECRET }}
          INITIAL_USER_PASSWORD: ${{ vars.INITIAL_USER_PASSWORD }}
          PORT: ${{ vars.PORT }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          NOTIFICATION_API_URL: ${{ vars.NOTIFICATION_API_URL }}
          NOTIFICATION_TOKEN_API_URL: ${{ vars.NOTIFICATION_TOKEN_API_URL }}
          NOTIFICATION_TOKEN_NAME: ${{ vars.NOTIFICATION_TOKEN_NAME }}
          NOTIFICATION_TOKEN_EMAIL: ${{ vars.NOTIFICATION_TOKEN_EMAIL }}
          NOTIFICATION_TOKEN_APPSNAME: ${{ vars.NOTIFICATION_TOKEN_APPSNAME }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          docker compose -f docker-compose.yml up -d --build --remove-orphans

      - name: Cleanup Docker images
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT }}
        run: |
          docker image prune --filter "until=24h" -f

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/config

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0
