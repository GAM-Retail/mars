name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard resolvconf

      - name: Connect to Corporate VPN
        run: |
          WG_CONF=$(mktemp /tmp/wg0.conf.XXXXXX)
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee "$WG_CONF" > /dev/null
          sudo chmod 600 "$WG_CONF"
          sudo wg-quick up "$WG_CONF"
          rm -f "$WG_CONF"
          sleep 3
          nc -zv -w 5 ${{ secrets.HOST }} ${{ secrets.SSH_PORT }}

      - name: Setup SSH for Docker
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/secret_key
          chmod 600 ~/.ssh/secret_key
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.HOST }}
            HostName ${{ secrets.HOST }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/secret_key
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Build and Deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}

          DATABASE_URL: ${{ vars.DATABASE_URL }}
          SHADOW_DATABASE_URL: ${{ vars.SHADOW_DATABASE_URL }}
          SESSION_SECRET: ${{ vars.SESSION_SECRET }}
          INITIAL_USER_PASSWORD: ${{ vars.INITIAL_USER_PASSWORD }}
          PORT: ${{ vars.PORT }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          NOTIFICATION_API_URL: ${{ vars.NOTIFICATION_API_URL }}
          NOTIFICATION_TOKEN_API_URL: ${{ vars.NOTIFICATION_TOKEN_API_URL }}
          NOTIFICATION_TOKEN_NAME: ${{ vars.NOTIFICATION_TOKEN_NAME }}
          NOTIFICATION_TOKEN_EMAIL: ${{ vars.NOTIFICATION_TOKEN_EMAIL }}
          NOTIFICATION_TOKEN_APPSNAME: ${{ vars.NOTIFICATION_TOKEN_APPSNAME }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          docker compose -f docker-compose.yml up -d --build --remove-orphans

      - name: Cleanup Docker images
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}
        run: |
          docker image prune --filter "until=24h" -f

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ~/.ssh/secret_key ~/.ssh/config

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0
