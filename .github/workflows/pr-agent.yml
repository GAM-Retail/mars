on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]          # CHANGED: was unscoped (fired on deleted too)

# ADDED: dedupe stale runs; cancel in-flight push reviews, let comment commands finish
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  pr_agent_job:
    # CHANGED: only run on PR comments (not plain issues); symmetric, explicit branches
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.39.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Review guidance (deduped, priorities ordered, confidence-gated)
          pr_reviewer.extra_instructions: |
            Determine the project's technology stack by inspecting repository configuration files such as 
            package.json, tsconfig.json, pyproject.toml, go.mod, Cargo.toml, composer.json, and Dockerfile. 
            Base your review on the detected frameworks, languages, and versions.

            Review priorities, in order:
            1. Correctness
            2. Security (incl. authorization/authentication and data integrity)
            3. Performance regressions
            4. Concurrency and async bugs

            Rules:
            - Report only medium/high-confidence issues. If unsure whether something is a bug
              or an intentional framework pattern, say so rather than presenting it as a defect.
            - Do not suggest stylistic changes or refactors unless they materially improve
              correctness or maintainability.
            - Do not flag patterns the framework's official docs explicitly recommend.
            - Do not recommend adding dependencies unless necessary.
            - Prefer finding one important bug over many minor observations.
            - Combine duplicate findings into a single review comment.
          pr_code_suggestions.num_code_suggestions: "4"
          pr_code_suggestions.suggestions_score_threshold: "8"
          # Enable/disable automatic tools
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '[
            "opened",
            "reopened",
            "ready_for_review",
            "synchronize"]'
          # Large-PR handling
          config.large_patch_policy: "clip"
          config.max_model_tokens: "32000"   
          config.patch_extra_lines_before: "3"
          config.patch_extra_lines_after: "1"
          config.restricted_mode: "true"
          config.model: "gpt-5-mini"
          config.fallback_models: '["gpt-4.1-mini"]'
