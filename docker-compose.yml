services:
  migrator:
    image: mars-setup-image
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: mars-db-migrator
    command: sh -c "npx prisma migrate deploy"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL}
    networks:
      - mars-network

  seeder:
    image: mars-setup-image
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: mars-db-seeder
    command: sh -c "npx prisma db seed"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD}
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - mars-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mars-app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SHADOW_DATABASE_URL=${SHADOW_DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - PORT=${PORT:-3000}
      - NOTIFICATION_API_URL=${NOTIFICATION_API_URL}
      - NOTIFICATION_TOKEN_API_URL=${NOTIFICATION_TOKEN_API_URL}
      - NOTIFICATION_TOKEN_NAME=${NOTIFICATION_TOKEN_NAME}
      - NOTIFICATION_TOKEN_EMAIL=${NOTIFICATION_TOKEN_EMAIL}
      - NOTIFICATION_TOKEN_APPSNAME=${NOTIFICATION_TOKEN_APPSNAME}
      - APP_URL=${APP_URL}
    depends_on:
      seeder:
        condition: service_completed_successfully
    networks:
      - mars-network

networks:
  mars-network:
    driver: bridge
    name: mars-network